server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The API plus the backend's own pages: OpenAPI docs, the crawler info page and the practice store.
    location ~ ^/(api|docs|openapi\.json|bot|practice)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
        client_max_body_size 20m;
    }

    # Built assets have hashed names, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routes fall back to the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
